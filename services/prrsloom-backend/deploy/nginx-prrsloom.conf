# Included inside the HTTPS server block of the PRRSLooM API host
location /prrsloom/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Uploads arrive through the Vercel proxy, which caps the whole request at 4 MB; the API
    # enforces its own per-file limit. Request buffering (nginx default) keeps slow uploads
    # from holding the single uvicorn worker.
    client_max_body_size 6m;
    # Every endpoint answers quickly: analyses run in background processes and the page polls.
    proxy_read_timeout 120s;
    # Response buffering (nginx default, kept on): large result files (PNG/ZIP, tens of MB for
    # big trees) are taken from uvicorn at local speed and fed to slow clients by nginx.
    # result.json is pre-compressed by the worker and sent with Content-Encoding: gzip, so
    # nginx gzip is not needed (nginx never re-compresses an already encoded response).
    proxy_buffering on;
}
